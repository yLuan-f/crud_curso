<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Detalhes do curso</title>
</head>
<body class="bg-slate-900">

<nav class="bg-black flex items-center justify-between p-4">
    <div class="text-indigo-500 text-4xl font-bold">Detalhes</div>
    <a href="/curso/list" class="bg-indigo-500 text-black px-4 py-2 rounded hover:bg-indigo-600">
        Voltar
    </a>
</nav>

<main class="max-w-2xl mx-auto mt-10 bg-slate-500 rounded-lg shadow p-8">
    <h1 class="text-3xl font-bold text-indigo-700 mb-6" th:text="${cursos.name}"></h1>

    <dl class="space-y-4">
        <div>
            <dt class="text-slate-300 text-xs uppercase tracking-wide">Professor</dt>
            <dd class="text-slate-100 text-lg" th:text="${cursos.teacher}"></dd>
        </div>
        <div>
            <dt class="text-slate-300 text-xs uppercase tracking-wide">Categoria</dt>
            <dd class="text-slate-100 text-lg" th:text="${cursos.category}"></dd>
        </div>
        <div>
            <dt class="text-slate-300 text-xs uppercase tracking-wide">Status</dt>
            <dd>
                    <span th:if="${cursos.active}"
                          class="bg-emerald-500/20 text-emerald-200 px-3 py-1 rounded-full text-sm">Ativo</span>
                <span th:unless="${cursos.active}"
                      class="bg-red-500/20 text-red-200 px-3 py-1 rounded-full text-sm">Inativo</span>
            </dd>
        </div>
        <div>
            <dt class="text-slate-300 text-xs uppercase tracking-wide">Criado em</dt>
            <dd class="text-slate-100" th:text="${#temporals.format(cursos.createdAt, 'dd/MM/yyyy HH:mm')}"></dd>
        </div>
        <div>
            <dt class="text-slate-300 text-xs uppercase tracking-wide">Atualizado em</dt>
            <dd class="text-slate-100" th:text="${#temporals.format(cursos.updatedAt, 'dd/MM/yyyy HH:mm')}"></dd>
        </div>
    </dl>
</main>

<div class="flex justify-center mt-6">
    <a th:href="@{/curso/details/edit/{id}(id=${cursos.id})}"
    class="bg-indigo-600 py-4 px-10 rounded text-white text-lg hover:bg-indigo-700">Editar informações
    </a>
</div>

<form th:action="@{/curso/delete/{id}(id=${cursos.id})}" method="post" class="flex justify-center mt-4">
    <button type="submit" class="bg-red-600 py-4 px-10 rounded text-white text-lg hover:bg-red-700">
        Deletar curso
    </button>
</form>

</body>
</html>
