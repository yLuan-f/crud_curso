<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Crie um Curso</title>
</head>
<body class="bg-slate-900">

<nav class="bg-black flex items-center justify-between p-4">
    <div class="text-indigo-500 text-4xl font-bold">Criação</div>
    <a href="/curso/list" class="bg-indigo-500 text-black px-4 py-2 rounded hover:bg-indigo-600">
        Voltar
    </a>
</nav>

<main class="max-w-2xl mx-auto mt-10 bg-slate-500 rounded-lg shadow p-8">
    <h1 class="text-3xl font-bold text-indigo-700 mb-6">Crie um Curso</h1>

    <form th:action="@{/curso/create}" th:object="${cursos}" method="post" class="space-y-5">
            <div>
                <label class="flex items-center gap-4 text-slate-300 text-base uppercase tracking-wide">
                    <span class="w-28">Nome</span>
                    <input type="text"
                       name="name"
                       th:field="*{name}"
                       placeholder="EX: Engenharia de Software"
                       class="placeholder-slate-700 text-lg w-6/12 text-black rounded-lg bg-slate-400"></input>
                </label>
            </div>
            <div>
                <label class="flex items-center gap-4 text-slate-300 text-base uppercase tracking-wide">
                    <span class="w-28">Categoria</span>
                    <input type="text"
                           name="category"
                           th:field="*{category}"
                           placeholder="EX: TI"
                           class="placeholder-slate-700 text-lg w-6/12 text-black rounded-lg bg-slate-400"></input>
                </label>
            </div>
            <div>
                <label class="flex items-center gap-4 text-slate-300 text-base uppercase tracking-wide">
                    <span class="w-28">Professor</span>
                    <input type="text"
                           name="teacher"
                           th:field="*{teacher}"
                           placeholder="EX: Roberto"
                           class="placeholder-slate-700 text-lg w-6/12 text-black rounded-lg bg-slate-400"></input>
                </label>
            </div>
            <div>
                <button class="bg-indigo-600 w-full py-3 rounded text-white text-lg hover:bg-indigo-700" type="submit">Cadastrar curso</button></div>
    </form>
</main>
</body>
</html>
